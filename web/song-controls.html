<div class="controls">
  <button data-action="toggle-chords">Chords</button>
  <div class="stepper">
    <button data-action="transpose-down" aria-label="Transpose down">−</button>
    <button class="transpose-value" data-action="transpose-reset" aria-label="Reset transpose">0</button>
    <button data-action="transpose-up" aria-label="Transpose up">+</button>
  </div>
  <button data-action="toggle-columns">Columns</button>
  <button data-action="session-toggle" aria-pressed="false">+ Session</button>
</div>
