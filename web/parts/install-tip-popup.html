<!-- First visit on the hosted site: how to add the book to the home screen (install-tip.js) -->
<dialog id="install-tip" class="print-dialog install-tip">
  <form method="dialog">
    <h3>Para acceso offline:</h3>
    <p><strong>iPhone:</strong> Compartir → “Añadir a pantalla de inicio”</p>
    <p><strong>Android:</strong> menú ⋮ → “Añadir a pantalla de inicio”</p>
    <div class="dialog-buttons">
      <button value="ok">Entendido</button>
    </div>
  </form>
</dialog>
