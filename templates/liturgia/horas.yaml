# Liturgia de las Horas: the tree shown in the contents. Parts stay hidden until a song
# is placed there with `horas:` in its file, e.g.
#   horas: [semana_i/domingo/laudes/himno, "*visperas/magnificat"]
label: Liturgia de las Horas
lists:   # extra sections: one part of every hour, e.g. Himnos > Laudes > "Lunes I: 5. Alfarero…"
  Himnos: {part: Himno, groups: [Laudes, Vísperas, Completas]}
parts:   # reusable lists of parts (anchors); not shown themselves
  laudes: &laudes [Apertura, Himno, Salmo 1, Cántico, Salmo 2, Responsorio, Benedictus, Padre Nuestro]
  visperas: &visperas [Apertura, Himno, Salmo 1, Salmo 2, Cántico, Responsorio, Magnificat, Padre Nuestro]
  completas: &completas [Apertura, Himno, Salmo, Responsorio, Nunc Dimittis, Antífona Mariana]
  completas_2: &completas_2 [Apertura, Himno, Salmo 1, Salmo 2, Responsorio, Nunc Dimittis, Antífona Mariana]
tree:
  Semana I: &semana
    Domingo:
      Primeras Vísperas: *visperas
      Laudes: *laudes
      Segundas Vísperas: *visperas
    Lunes: {Laudes: *laudes, Vísperas: *visperas}
    Martes: {Laudes: *laudes, Vísperas: *visperas}
    Miércoles: {Laudes: *laudes, Vísperas: *visperas}
    Jueves: {Laudes: *laudes, Vísperas: *visperas}
    Viernes: {Laudes: *laudes, Vísperas: *visperas}
    Sábado: {Laudes: *laudes}
  Semana II: *semana
  Semana III: *semana
  Semana IV: *semana
  Completas:
    Domingo (primeras Completas): *completas_2
    Domingo (segundas Completas): *completas
    Lunes: *completas
    Martes: *completas
    Miércoles: *completas_2
    Jueves: *completas
    Viernes: *completas
